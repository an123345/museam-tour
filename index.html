gr:{
title:"Ξενάγηση Μουσείου",
sections:[
["Νεότερη Ιστορία", `Τον 16ο αιώνα, η Ξάνθη, όπως όλη η Ελλάδα, ήταν υπό την οθωμανική αυτοκρατορία. Τότε η Ξάνθη ήταν ένα μικρό χωριό. Ώσπου ο σουλτάνος της περιοχής έφερε γάλλους επιστήμονες οι οποίοι έψαχναν μέρος για να φυτέψουν καπνά. Γύρισαν όλη την Θράκη αλλά μόνο στην Ξάνθη βρήκαν κατάλληλο καιρό και χώμα. Η Ξάνθη τότε είχε πολύ ξηρό κλίμα και το χώμα της περιείχε πολύ ασβέστη. Έτσι τα καπνά που φυτέψαν και τα τσιγάρα που έφτιαξαν είχαν ένα πολύ ωραίο άρωμα και ιδιαίτερη γεύση. Η ποικιλία καπνού που καλλιεργήθηκε στην Ξάνθη, ονομάστηκε μπασμάς. Είναι μικρά αρωματικά φύλλα καπνού, τα οποία, από τότε μέχρι και πριν λίγα χρόνια, στο μεγαλύτερο ποσοστό εξάγονταν στην Αμερική. Έτσι, όλοι άρχισαν να καλλιεργούν καπνό μανιωδώς. Ο καπνός ήταν μονοκαλλιέργεια και μονοπώλιο. Το 1829 έγινε ένας μεγάλος σεισμός και κατέστρεψε την πόλη ολοκληρωτικά. Μέχρι εκείνη την στιγμή, πρωτεύουσα ήταν η Ξάνθη, αλλά λόγω της καταστροφής, αναγκάστηκαν και μετέφεραν την πρωτεύουσα στη Γενισέα, ένα χωριό κοντά στα Άβδηρα. Η Γενισέα παρέμεινε πρωτεύουσα για περίπου 30 χρόνια έως ότου κάηκε από μια μεγάλη πυρκαγιά. Σύμφωνα με την τοπική παράδοση, την φωτιά την έβαλε ο αγάς της Ξάνθης, επειδή είχε μεγάλες διαφορές με τον αγά της Γενισέας. Αφορμή στάθηκε ένα φιρμάνι που είχε βγάλει ο σουλτάνος, σύμφωνα με το οποίο μόνο οι κάτοικοι της Ξάνθης είχαν δικαίωμα στο εμπόριο καπνού. Το προνόμιο αυτό δεν το είχαν οι κάτοικοι της Γενισέας. Μετά την καταστροφή της Γενισέας η πρωτεύουσα επέστρεψε στην Ξάνθη και μαζί επέστρεψαν όλα τα οικονομικά και διοικητικά οφέλη. Από τότε άρχισαν τα χτίζονται τα κτίρια της Παλιάς Πολης: περίπου 100 αρχοντικά πλουσίων καπνεμπόρων και μικρότερες κατοικίες της εργατικής τάξης. Ο πληθυσμός της πόλης ήταν οργανωμένος σε κοινότητες: χριστιανική, μουσουλμανική, αρμενική και εβραϊκή, ενώ οι εργαζόμενοι οργανώνονταν σε σωματεία και συνδικάτα.<br>
Τα εργοστάσια χτίστηκαν νότια της πόλης, μακριά από τον οικισμό. Για να λειτουργήσουν χρειάζονταν εργατικό δυναμικό. Οι αγρότες όμως δεν εγκατέλειπαν τα χωριά και την καλλιέργεια καπνού για να έρθουν στην πόλη να δουλέψουν ως εργάτες, γιατί υποστήριζαν ότι ο καπνός απέφερε μεγάλα κέρδη. Λέγεται, ότι μία οκά καπνού πωλούνταν για 2-3 χρυσές λίρες, ποσό πολύ μεγάλο για την εποχή. Έτσι οι καπνέμποροι έφεραν εργάτες, κυρίως άνδρες, από γειτονικές περιοχές. Για αυτό η Ξάνθη, εκτός από πρωτεύουσα του καπνού, απέκτησε και την φήμη της "πρωτεύουσας των καμπαρέ", λόγω του μεγάλου ανδρικού πληθυσμού που συγκεντρώθηκε εκεί. Γύρω στο 1900, παρόλο που η πόλη βρισκόταν ακόμη υπό οθωμανική κυριαρχία, θεωρούνταν μια από τις πλουσιότερες πόλεις χάρη στον καπνό. Η περιφέρεια της Ξάνθης απαριθμούσε περίπου 89.000 κατοίκους. Στην πόλη λειτουργούσαν 4 προξενεία, 4 τράπεζες, 250 καταστήματα, 114 αυτοκίνητα, 4 συνεργεία αυτοκινήτων, 53 χάνια, 2 θέατρα και 2 κινηματογράφοι. Υπήρχε νοσοκομείο από το 1907, σιδηροδρομικός σταθμός από το 1908, γιατροί, συμβολαιογράφοι και ασφαλιστικές εταιρείες. Το 1926 λειτούργησε εργοστάσιο παραγωγής ηλεκτρικού ρεύματος και το 1929 διοργανώθηκαν ακόμη και καλλιστεία. Οι καπνέμποροι δέχονταν έντονες επιρροές από την Δύση και δεν ήθελαν να μοιάζουν με την αγροτική και εργατική τάξη. Έτσι υιοθέτησαν ευρωπαϊκά πρότυπα. Στην αρχιτεκτονική κυριάρχησε ο εκλεκτισμός. Βέβαια, σε πολλά σπίτια μαζί με τα ευρωπαϊκά στοιχεία έχουμε και τα ανατολίτικα, γι’ αυτό συχνά γίνεται λόγος για τουρκομπαρόκ. Το 1912 απελευθερώθηκε προσωρινά η Ξάνθη από τους Οθωμανούς. Αμέσως ακολούθησαν οι Βαλκανικοί πόλεμοι και ο Α΄ & Β΄ Παγκόσμιος πόλεμος. Η πόλη γνωρίσε δύο βουλγαρικές κατοχές οι οποίες ήταν τόσο σκληρές που η οικονομία της καταστράφηκε. Όταν απελευθερώθηκε το 1945, η Ξάνθη ήταν ήδη κατεστραμμένη. Μετά τον πόλεμο ο πληθυσμός του νομού έφτανε μετά βίας τους 30.000 κατοίκους. Από μια πολύ πλούσια πόλη, η περιοχή χαρακτηρίστηκε, μαζί με την Ήπειρο, από τις φτωχότερες περιοχές της Ευρώπης. Τότε οι Ξανθιώτες έλεγαν χαρακτηριστηκά ότι «όσοι ασχολήθηκαν με τα καπνά, τα λεφτά τους έγιναν καπνός».<br>
Η Ξάνθη άρχισε να αναπτύσσεται ξανά τη δεκαετία του 1970 με το συνεταιριστικό κίνημα. Στην συνέχεια, απέκτησε συγχρόνη βιομηχανία και σήμερα ο πληθυσμός της φτάνει τους 55.000 κατοίκους στην πόλη και άλλους τόσους στα χωριά .`, "audio/history.mp3"],
["Το Κτίριο", `Το αρχοντικό αυτό είναι ένα δίδυμο σπίτι. Τα δύο αυτά σπίτια είναι ίδια μεταξύ τους και ενωμένα. Ενώνονται στο υπόγειο και στο ισόγειο με πόρτα. Ανήκαν στους αδερφούς Κουγιουμτζόγλου, οι οποίοι ήταν καπνέμποροι. Ο πατέρας τους, Έλληνας, χριστιανός από την Κωνσταντινούπολη ήρθε στην Ξάνθη, έχτισε το γωνιακό σπίτι, το ζωγραφισμένο εξωτερικά και επειδή είχε δύο αγόρια έχτισε δύο ίδια σπίτια γι αυτά. Τα σπίτια αυτά χτίστηκαν το 1860-1862 από ηπειρώτες τεχνίτες, ενώ τις τοιχογραφίες και τα
ξύλινα διακοσμητικά τα έχουν κάνει οι Βαυαροί το 1866. Μέχρι το 1972 στο ένα σπίτι κατοικούσε η Άννα Κουγιουμτζόγλου, η οποία το δώρισε στο
Δήμο Ξάνθης και αυτός με τη σειρά του το παραχώρησε σε έναν σύλλογο, στη ΦΕΞ, για να το κάνει μουσείο. Το άλλο σπίτι όμως πουλήθηκε και το αγόρασε η ΦΕΞ και έτσι και τα δύο
σπίτια μαζί λειτουργούν σαν μουσείο από το 1975. Το κτήριο έχει το υπόγειο, το οποίο το χρησιμοποιούσαν σαν αποθήκη, το ισόγειο που ήταν οι χώροι υποδοχής, σαλόνι – τραπεζαρία –γραφείο κλπ, και ο όροφος που ήταν τα υπνοδωμάτιά τους. Επίσης το σπίτι από τότε που
χτίστηκε είχε δύο εσωτερικές τουαλέτες στο ισόγειο και δύο στον πάνω όροφο καθώς και δύο ατομικά χαμάμ, ένα γυναικείο και ένα αντρικό, έξω στην αυλή.`, "audio/ktirio.mp3"],
["Οι Εκθέσεις", `Στο μουσείο τώρα στο ισόγειο στα δύο πρώτα δωμάτια έχουμε τις φωτογραφίες της οικογένειας Κουγιουμτζόγλου. Πιο μέσα ακολουθεί μία έκθεση η οποία αναπαριστά την
αστική ζωή του 1930 στην Ξάνθη. Θα δείτε μια αίθουσα πιάνου όπου ένα παιδάκι μαθαίνει
πιάνο, αλλά αυτό αναπαριστά και τον Μάνο Χατζιδάκι, ο οποίος γεννήθηκε στην Ξάνθη το 1925.
Πιο μέσα είναι το γραφείο του Κουγιουμτζόγλου με διάφορα προσωπικά του αντικείμενα και
μία τραπεζαρία με τις κυρίες ντυμένες με ρούχα εποχής να παίρνουν το δείπνο τους. Η έκθεση

Κάτω στο υπόγειο έχουμε τα επαγγέλματα και τους επαγγελματίες που υπήρχαν στην
Ξάνθη στις αρχές του 20ου αιώνα σύμφωνα με δύο επαγγελματικούς οδηγούς του 1911 και

]

en:{
title:"Museum Tour",
sections:[
["History",`In the 16th century, like the rest of Greece, Xanthi was under the rule of the
Othoman Empire. At that time it was only a small village. As tradition dictates the
sultan invited French experts to find a suitable palace for tobacco cultivation. They
travelled across Thrace but only in Xanthi did they find the ideal conditions: a dry
climate and limestone-rich soil. The tobacco grown there developed a rich, delicate aroma and a distinctive flavor. It became known as “Basmas”. With its small highly aromatic leaves Basmas gained an international reputation and until a few year ago, most of it was exported to the USA.<br>
As a result tobacco became the region&#39;s main crop as well as a state monopoly. In 1829 a powerful earthquake completely destroyed Xanthi. Until then the town had been the administrative centre of the region. Following the disaster the capital was moved to Genisea, a village near the sea close to Abdera, where it remained for the
next thirty years. According to the local tradition Genisea was eventually destroyed
by a fire set by the Agha of Xanthi. He is said to have been a fierce rival of the Agha
of Genisea, because of a decree issued by the Sultan, which granted only the
residents of Xanthi as regional capital the right to trade tobacco. After the fire Xanthi
once again became the capital restoring its economic prosperity and political
importance.<br>
From that moment on, Xanthi entered a period of rapid growth. In what is now the old town, around 100 mansions were built by wealthy tobacco merchants, alongside
more modest homes for working- class families. The town flourished and distinct
Christians, Muslims, Armenians and Jewish communities emerged while workers
and laborers formed associations and trade unions. The factories were built in the
southern part of the town, away from the residential area and as expected needed
workers. However, the villagers chose to remain in their fields, as tobacco cultivation
provided a good income. It is said that one oka (about 1.3 kilograms) of tobacco was
sold for two or three gold pounds, an exceptionally high price at the time. As a result,
tobacco merchants had to hire workers, mainly men from nearby towns.
By 1900, although Xanthi was still under Ottoman rule it had become one of the
wealthiest towns in the region thanks to the tobacco trade. With nearly 90.000
inhabitants in the wider district the town was flourishing. It was home to four
consulates, four banks, hundreds of shops, theatres and cinemas. Its rapid
development continued with the opening of a hospital in 1907, a railway station in
1908, and a power plant in 1926, attracting professionals and scholars from across
the region. As Xanthi prospered through the tobacco trade, its wealthy merchants
looked to Western Europe for inspiration. The embraced the architectural style of
Eclecticism, while many buildings also retained elegant elements of the Ottoman
Baroque style. This unique blend of East and West still defines the town’s
architectural character today.<br>
In 1912 Xanthi was liberated from the Ottoman rule. But its freedom was short-lived. The balkan Wars and the two World Wars brought two cure Bulgarian occupations. These difficult years left the town economically devastated.
In 1945 Xanthi was finally independent. However much of the town lay in ruins, and
its population had been greatly reduced. Once a remarkably prosperous town, Xanthi
poorest regions in Europe.<br>
The town began to recover in the 1970 with the cooperative movement. Since then, it has developed a modern industrial base. Today, around 55.000 people live in the town, with a similar number living in the surrounding villages.`,"audio/historyen.mp3"],
["Building",`This twin mansion consists of two identical residences joined together. It belonged to the Kouyioumtzoglou brothers prosperous tobacco merchants. Their father, a Greek Orthodox Christian from Constantinople, settled in Xanthi and built the adjacent
corner house before commissioning these twin residences, one for each of his sons.
The mansion was built between 1860 and 1862 by master builders from Epirus,
while its wall painting and carved wooden decorations were completed in 1866 by
Bavarian craftsmen.
Until 1972, one of the two houses was the home of Anna Kouyiomtzoglou, who
donated it to the Municipality of Xanthi. The municipality entrusted it to the local
cultural association F.E.X to establish museum. After F.E.X bought the second
house, the twin mansion became a single museum, the Historical and Folklore
Museum of Xanthi which it remains today.
The mansion has a basement, a ground floor and an upper floor. The basement was
shared by both residences and used for storage. The
ground floor housed the reception rooms, living room, dining room, study and kitchen
with the two residences connected by a large wooden door. The upper floor
contained the family bedrooms separated by a dividing wall. From the very
beginning, each residence had two indoor toilets, one on each floor, a remarkable
feature for its time. The shared back courtyard also included two private hammams,
one for men and one for women, used by both families.`,"audio/building.mp3"],
["Exhibits",`The first two rooms on the ground floor display photographs of the Kouyioumtzoglou
family. The exhibition then recreates urban life in Xanthi during the 1930s. One of the
rooms features a piano with a child taking a music lesson, a symbolic tribute to the
famous Greek composer Manos Hadjidakis, who was born in Xanthi in 1925. Nearby
the tobacco merchant Kouyioumtzoglou&#39;s study, displaying his personal belongings,
and the dining room, where figures in the period costumes recreate a family dinner.
The exhibition continues on the upper floor with a children&#39;s bedroom and a master
bedroom from the 1930s, an important collection of Greek postage stamps from
1940 to the present, a small exhibition on the refugees of 1922, and the mansion&#39;s
beautiful wall and ceiling paintings.
The basement presents the professions and trades practiced in Xanthi during the
early 20th century, as documented in two professional directories published in 1911
and 1934. These directories illustrate the city&#39;s economic and cultural development
during that period. The exhibition also features folklore artifacts, including traditional
costumes, everyday household objects, and agricultural and livestock farming tools,
offering visitors an insight into the daily life, occupation and traditions of the local
community.`,"audio/exhibition.mp3"]
]
},
tr:{
title:"Müze Turu",
sections:[
["Tarih",`Merhaba! Hoş geldiniz, Öncelikle, müze İskeçe halkının tanıtılması için düzenlenmiştir. Antik tarihimiz için en ideal yer, Demokritos ‘ un vatanı Avdira’ dır. Müzemizde bölgenin çağdaş tarihi hakkında önemli bilgiler sunuyoruz. İskeçe, 1856’da Rus-Türk savaşı bittiğinde ve Sultan iki sözleşmeyi, yani Hatt-i hümayunu ve Tanzimatı imzaladığında ilgi odağı oluyor. Bu durumda bu sözleşmeler ticareti geliştirip Osmanlı tütün tekelini iptal edecek ve 1860’tan 1930’a kadar tütün ticareti şirketleri bu varlıklı yüz büyük ailenin yönetiminde olacak. Bunlar Hristiyan , Yahudi, Ermeni ve Müslümanlardır. Bir çoğu İstanbul’dan diğerleri ise Selanik ve adalardan gelmiştir. Bunlar, günümüzde de İskeçe’yi tütünün başkenti yapan basma adı verilen ve doğudan gelen özel bir tütün ürününün, dönemin yatırımcılarıdır. Tütün tüccarları, İskeçe’nin antik şehir denilen bölgesinde 100 tütün mağazası ve günümüzde yeni, modern şehir olan bölgede fabrikalar inşa edeceklerdir. Ayrıca, tren hatlarını, hatta Porto Lagos ve Kavala ‘ nın limanlarını kullanarak Avrupa, Karadeniz ve Kuzey Afrika’daki ihracatlarını gerçekleştireceklerdir. Gelişim o kadar büyük olacak ki, Osmanlılar, Başkenti Yenisea’dan (ovanın ortasında bir köy) İskeçe’ye getirecek. O zamana kadar bölgenin gelişmesinde rolü olan çiftçiydi. İskeçe’yi Yunanistan’ın diğer şehirlerinden farklı kılan şey, köylerdeki çiftçilerin şehrin fabrikalarında çalışmaya gelmemesidir. Çifçiler tütün yetiştirerek çok iyi para kazanıyordu. Tütünün yetiştirilip işlenmesi ve mağazaya teslim edilmesi yaklaşık bir yıl sürmektedir. Tüm bunlar çiftçilerin köylerde kalmalarını sağlar ve böylece şehrin fabrikalarına başka şehirlerden işçiler gelecek. İskeçe’de 1860 yılında fabrikalar ve yeni işçi sınıfı ortaya çıktı. Aynı zamanda hizmet vermek için bazı dernekler ve birliklerde örgütlenecek kişiler, Yunan, Ermeni, Yahudi gibi topluluklarda, 1913 yılına kadar Osmanlı idaresinde zayıf ve güçsüzleri korumak için gruplar halinde dernekler, loncalar ve mahallelerde toplanacak olan insanlar da. İskeçe, 1860 ‘tan İkinci Dünya Savaşına kadar iyi ve zengin hayat sürer. İskeçe’de 1900 yılında dört konsolosluk, 3 banka, hastane, 2 tiyatro ve sinema bulunmaktadır. 1924 yılında elektrik üreten fabrikalar, araba atölyeleri, 53 otel, hukuk büroları ve sigorta şirketleri bulunmaktadır. Tabii ki, Batı’nın etkisiyle tütüncüler, köylü ve işçi sınıfιna benzemek istemedikleri için Avrupa ‘ yı taklit edecekler. Ayrıca eklektizm mimarisi görülmekte. Bazen turkobarok sınırlarında olduğumuzu söylememizin nedeni bir çok evde Avrupa ‘ nın etkisi yanısıra batı unsurlarının da var olmasıdır. Kuyumcoğlu ailesi buna bir örnektir. Kuyumcoğlu ailesi köşeye baba ocağını inşa edecek, fakat iki oğlu olduğu için onlara başlarını sokacakları bu iki aynı evi (müzeyi) inşa edecek. Mihalogleika’nın (başka bir ailenin) dördüz oğulları olduğu için dört tane aynı evi varmış. Bu evlerin tuvaletleri 1860 yılından beri içeride, hatta burada içi ve dışı boyalı muhteşem bir porselen havza göreceksiniz. Üst katta yatak odaları bulunduğu için , bu iki ev birbirinden bağımsız. Dediğimiz gibi kardeş olabilirler ama ikisinin de yatak odası ayrı. Zemin kat aynı hizmetçileri paylaşmak için ortak kullanılmaktadır. Eşlerinin araları iyi olmadığı zamanlarda, evin ortasındaki koridor kapısını kapatıp iki ayrı, bağımsız ev oluşturulmaktadır. Bodrum kiler ve çalışanların alanı olarak kullanılmaktadır. Arka bahçede iki tane kişiye özel hamam (bir kadın , bir erkek hamamı) ve özel olarak inşa edilmiş bir kilise bulunmaktadır. Ailenin Filibe, Hamburg, Kavala ve Atina’da ofis ve evleri, burada da (yani Iskeçe’de) fabrikaları vardı. Tüm bunlara rağmen Kuyumcoğlu ailesi Iskeçe ‘nin en zengin ailesi değildi, çünkü İskeçe’de 100 tane daha böyle ev bulunmaktadır. Bunların hepsini tütün üretimi ile elde etmişlerdir ve Ιkinci Dünya Savaşına kadar sürecektir. 1. ve 2. Dünya Savaşı sırasında Iskeçe iki Bulgar işgali ile karşı karşıya gelecek ve şartlar zor olduğu için, ekonomik durumumuz etkilenecek. Müzedeki deyime göre << her kim tütün satarak para kazandıysa, savaştan sonra tüm paralar toz duman olmus >> (yani paralarını kaybettiler) . Iskeçe 80’li yıllarda yine ortaklık devinimiyle gelişecek ve daha sonra modern endüstri gelişecek. Bugün Iskeçe ‘ nin nüfusu şehirde 52-55.000 ve bir o kadar da köylerde ikamet eden kişilerden oluşmaktadır. Yine topluluklar, farklı gruplar mevcuttur. Maalesef geri dönmeyen tek topluluk Iskeçe ‘nin Yahudileri ‘dir. Geri kalanlar yasal olarak derneklerdedir. Trakyalılar, Anadolulu Yunanlılar ,Karadenizliler , Kapadokyalılar, Pomaklar, Türkler, Çingeneler ,Afrikalılar, Karakaçanlar, Giritliler ,Kıbrıslılar... Bu yüzden birçok müzik , dans, yemek, tatlı, içecek türü göreceksiniz ve biz birlikte çalışırken biraz etnik caz oluyoruz.`],
["Bina",`Bunların hepsini müzenin içinde göreceğiz. Bu bina yaklaşık diğer 100 evin örneğidir. Varlıklı ailelerin 2.ci Dünya Savaşına kadar çok parası olduğu için, her yeni nesil Avrupa ΄ dan ressam getirtip, yeni modayı vurguluyormuş, böylece bu müzeyi üç kere çizmişler. Savaştan sonra paralar toz duman olduğunda evi beyazlatmak için ressamların yerine yağlı boyacılar gelecek. Bu bina satılıp derneğimiz tarafından satın alındığında müze oldu ve tütüncülerden sonra Batı Yunanistan ‘ ın tamamen restore edilmiş en büyük binasıdır ve bugünkü çalışma şekli ise şu şekildedir`,"audio/8.mp3"],
["Eserler",`Zemin katta şehirli sınıfının günlük hayatlarının sergilendiğini göreceksiniz. Yemek masasında kadınların akşam yemeklerini aldıklarını göreceksiniz. Pembeli bayan Frosinoula Kulakoğlu 1929 Iskeçe güzelidir (şehir sınıfının güzeli). Çalışma odasında patronlar ve tütünle ilgili bazı unsurlar sergilenmekte, yanında ise şehrin yetmiş piyanosundan biri. Bu tarz evlerin hepsinde çocuklar için Fransızca ve piyano dersleri veriliyordu. Piyanonun arka tarafında evin ilk mutfağı bulunmaktadır. Bugün çok amaçlı eğitim programları için kullanılmaktadır. Ikinci mutfak ise bugünkü müzenin bilet satış ofisidir. Buradan bahçeye çıkıp hamam ve kiliseyi göreceksiniz. Hamamları özel yapan şey ise bireysel olmalarıdır. Daha sonra yatak odalarının olduğu kata çıkacaksınız. Tüm tavanların boyalı olduğunu göreceksiniz. Ayrıca pulların bulunduğu oda görülmeye değer. Kapının üstünde evin 1860, 1990 ve 1930’da boyandığı üç aşamayı da görmeniz mümkün. Böylece bodruma inmek üzere Iskeçenin tütüncüleri ve (üst düzeydeki insanları) hakkında bir görüntüyle karşılaşacaksınız. Ilk aşamada tarımsal unsurlara rastlayacaksınız. Balkanlar ve Avrupa'da yaygın oldukları için oldukça kapsayıcı inanışlardır. Belki de en ilgi çeken oda dokuma tezgahının bulunduğu odadır. Orada iki Iskeçeli kadın bulunmaktadır. Kadınlardan biri Hristiyan diğeri de müslümandır. Çoğu ziyaretçi iki farklı kadın görmeyi bekler fakat göreceğiniz üzere bulduğumuz kıyafetlerin (kumaşı) , malzemeleri, renkleri, desenleri hemen hemen aynı (ve çok zengin). Yani burada muhtemelen hem Hristiyanlar, hem Müslümanlar, hem Yahudiler hem de Ermeniler aynı şekilde üşüyormuş. Hepsi güzel görünmek istiyormuş, bu yüzden onları birbirinden ayırmak imkansız. Son olarak, bodrumun geri kalanı İskeçe’nin girişimciliği için adanmıştır ve iki profesyonel rehberimiz bulunmaktadır. 1010-1011 yılları arasındaki Türk işgali üzerine hala burada ve diğeri 1934-1936 yılları arasında İskeçe 'nin Belle Epoque'u hakkında bilgi sahibi olduğumuz yer. Şehrin büyük ekonomik gelişimine ve fazlasına tanıklık eden değişik metinler, fotoğraflar ve nesneler bulunuyor. Sergiyi listemizdeki isimlerle kapatıyoruz. Profesyonel isimlere değiniyoruz. Bir göz atarsanız çalışanlardan tütüncülere kadar herkesin işini korumak için birliklere organize olduğunu göreceksiniz. Soy adlarını okuyacak olursanız aynı birlik içinde Hristiyan , Yahudi, Müslüman ve Ermenilerin yer aldığını göreceksiniz. Burada muhtemelen önce ekonomi yer alıyordu sonra herkes istediği yerde, istediği şekilde, istediği tanrıya tapıyordu. Bu nedenle bugün bile söylediğim üzere İskeçe'de farklı kökenlerden insanların bulunduğu dernekler var ve sinagog dışındaki tüm tapınaklar normal bir şekilde çalışmaktadır. Hristiyanlar-Ortodokslar-Katolikler, Yehova'nın kiliseleri, eski takvim, pentekostal, Ermeni kiliseleri,camiler, Sünnilerimiz, Şiilerimiz, Bektaşı Müslümanlarımız var. Βu da bizi bu kadar küçük bir şehrin içinde kültürel unsurlar açısından çok zengin kılıyor. Teşekkür ederim ve şehrimizde güzel vakit geçirmenizi dilerim.`]
]

function startTour(lang){
document.querySelector(".home").style.display="none";
document.getElementById("tour").style.display="block";
document.getElementById("title").innerText=data[lang].title;
let html="";
data[lang].sections.forEach((s,i)=>{
html += `
<div class="card">
<div class="card-header" onclick="toggle(${i})">
<span>${s[0]}</span>
${lang !== 'tr' ?`
<button class="audio-btn" onclick="event.stopPropagation(); toggleAudio('${s[2]}')">
🔊
</button>
`:''}
</div>
<div class="card-content" id="c${i}">
<p>${s[1]}</p>
</div>
</div>
`;
});
document.getElementById("cards").innerHTML=html;

}

function toggle(i){
let contents = document.querySelectorAll(".card-content");
contents.forEach((item,index)=>{
    if(index === i){
        if(item.style.display === "block"){
            item.style.display = "none";
        }
        else{
            item.style.display = "block";
        }
    }else{
        item.style.display = "none";
    }
});

}

function toggleAudio(file){
    // Αν υπάρχει ήδη ήχος
    if(currentAudio){
        // Αν είναι ο ίδιος ήχος
        if(currentAudio.src.includes(file)){
            // Αν παίζει, κάνε pause
            if(!currentAudio.paused){
                currentAudio.pause();
            }
            // Αν είναι σταματημένος, συνέχισε από εκεί που έμεινε
            else{
                currentAudio.play();
            }
            return;
        }
        // Αν πατήθηκε άλλο ηχητικό, σταμάτα το προηγούμενο
        currentAudio.pause();
    }

    // Δημιουργία νέου ήχου μόνο την πρώτη φορά
    currentAudio = new Audio(file);
    currentAudio.play();

}

</script>
